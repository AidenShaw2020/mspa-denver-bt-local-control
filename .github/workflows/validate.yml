name: Validate integration and distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run protocol and Home Assistant adapter tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate installation archive
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mspa-local-installation-package
          path: dist/*
